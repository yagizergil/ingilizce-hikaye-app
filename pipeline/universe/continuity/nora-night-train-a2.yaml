series: nora-night-train-a2
episodes:
- index: 1
  slug: nora-night-train-a2-e01
  title: The Ticket to Nowhere
  summary: Nora, conductor of the 22:40 night train from Port Lumen to Hollen, meets Emil, an old man
    with a forty-year-old paper ticket to Brennmoor, a station closed thirty years ago, where Marta once
    waited for him. Driver Bruno slows the train so Emil can see the old station and its green door. In
    Hollen, Nora learns Marta Kell lives on Mill Street and reunites them. That night she finds her father's
    name in old ink in her own blue notebook.
  facts:
  - The night train leaves platform 9 at 22:40 and arrives in Hollen in the morning.
  - Brennmoor is a closed station after the long bridge and before the tunnel; a house with a green door
    stands beside it.
  - Driver Bruno is sixty and loves old songs.
  - Marta Kell lives on Mill Street in Hollen and walks to the bakery every morning.
  - Nora buys coffee at Leo's café at 22:00 before every shift.
  open_threads:
  - Why is her father's name written in Nora's notebook?
