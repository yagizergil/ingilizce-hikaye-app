series: leo-little-cafe-a1
episodes:
- index: 1
  slug: leo-little-cafe-a1-e01
  title: The Empty Chair
  summary: Ada, a retired piano teacher, sits in the same window chair at Leo's café every morning at
    7:15. One rainy Monday a young tourist takes her chair. Leo brings an old red chair from the back
    room and asks the tourist to share the table; Ada helps him with his map and they become friends.
    Ada adopts the red chair. At the end, a letter from the building owner arrives and Leo stops laughing.
  facts:
  - Leo opens the café at 7:00 and plays music.
  - Ada drinks a small black coffee and eats one orange cake.
  - The café has five tables and one window facing the station.
  - There is a small back room; the old red chair is now 'Ada's chair'.
  - 'Directions to the Old Market: down the street, left at the big tree.'
  open_threads:
  - The letter from the building owner (likely a rent increase).
