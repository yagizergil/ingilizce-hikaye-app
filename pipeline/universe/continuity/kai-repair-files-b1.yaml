series: kai-repair-files-b1
episodes:
- index: 1
  slug: kai-repair-files-b1-e01
  title: The Voice Note
  summary: 'Danny, fifteen, brings his late grandmother''s broken phone to Kai to recover a birthday song
    she recorded for his mother Ines. Kai repairs it, finds the song and also a second recording titled
    ''For Ines – only after''. Following Mr Okafor''s advice, Kai does not listen to it but tells Danny
    it exists and lets the family choose. Ines later thanks him: it was her mother''s goodbye. Then Mara
    Lind arrives with a deliberately smashed phone and asks for secrecy.'
  facts:
  - 'Kai''s rule: he never looks at messages or photos, only what the customer asks for.'
  - Kai's sister Lina is a nurse who works night shifts.
  - Mr Okafor sells radios next door and brings tea most mornings.
  - Danny's mother is called Ines; the grandmother died in March.
  - Kai asked to be paid with the shoebox.
  open_threads:
  - Whose smashed phone did Mara bring, and what is on it?
