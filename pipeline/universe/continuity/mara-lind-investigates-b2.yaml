series: mara-lind-investigates-b2
episodes:
- index: 1
  slug: mara-lind-investigates-b2-e01
  title: The Last Fisherman
  summary: 'Piet Haas, the last fisherman refusing to sell to Harbour Lights, asks Mara to meet at dawn,
    but signs the contract overnight after three visitors offer double the market price and show him a
    private photograph. Former neighbour Greta hints the buyers knew everyone''s secrets. Intern Sofi
    discovers three small Harbour Lights companies share an address above a laundry at 14 Corder Street,
    one paid monthly for ''neighbourhood engagement analysis''. Mara sees one of the visitors destroy
    a phone there, takes it to Kai''s repair shop, and receives an anonymous message: ''Stop.'''
  facts:
  - Harbour Lights is a group of six companies; three small ones were registered two years ago at 14 Corder
    Street, above a laundry.
  - Fifty-three properties in the old quarter; Piet's blue house was the last.
  - Three years ago Mara published a wrong story about a hospital director; editor Elias Brandt defended
    her.
  - Greta used to run the fish café on the corner.
  - The woman in the neat grey coat visited Piet and threw away a smashed phone.
  open_threads:
  - What is on the smashed phone?
  - Who sent 'Stop'?
  - What was in Piet's photograph?
