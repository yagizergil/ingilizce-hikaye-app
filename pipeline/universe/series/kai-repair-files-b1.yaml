descriptions:
  tr: "Eski Çarşı'daki küçük tamir dükkânına gelen her bozuk telefon bir hayatın kapısını aralıyor."
  en: "Every broken phone that comes into Kai's tiny shop opens a small door into someone's life."
  de: "Jedes kaputte Handy in Kais kleiner Werkstatt öffnet eine Tür in das Leben eines Menschen."
  fr: "Chaque téléphone cassé qui arrive chez Kai ouvre une petite porte sur une vie."
  it: "Ogni telefono rotto nella piccola bottega di Kai apre una porta sulla vita di qualcuno."
  es: "Cada teléfono roto que llega al taller de Kai abre una pequeña puerta a la vida de alguien."
  ru: "Каждый сломанный телефон в мастерской Кая приоткрывает дверь в чью-то жизнь."
  ar: "كل هاتف معطّل يصل إلى ورشة كاي يفتح بابًا صغيرًا على حياة أحدهم."
  zh: "每一部送进凯的小店的坏手机，都打开了一扇通往别人生活的门。"
  ja: "カイの小さな店に届く壊れたスマホは、誰かの人生への小さな扉を開く。"
next_hooks:
  - A phone full of unsent messages to the same person.
  - Mara Lind brings a phone that was clearly broken on purpose.
episodes:
  - index: 1
    slug: kai-repair-files-b1-e01
    title: The Voice Note
    premise: >
