format: >
  Episodes of 2000-3000 words, 3-5 chapters. A customer brings a broken
  device; while repairing it Kai sees a small part of their life and faces a
  moral choice. Ends with a decision and its consequence.
titles:
  tr: "Tamirci Kai'nin Dosyaları"
  en: "The Repair Shop Files"
  de: "Die Akten der Reparaturwerkstatt"
  fr: "Les dossiers de l'atelier"
  it: "I casi dell'officina di Kai"
