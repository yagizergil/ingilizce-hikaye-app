genres: [mystery, drama]
themes: [travel, kindness, strangers]
format: >
  Episodes of 700-1200 words, 3 chapters. Each night one passenger has a
  small secret or problem; Nora notices a detail and helps. A slow larger
  thread: clues about why her father left the city.
titles:
  tr: "Nora ile Gece Treni"
  en: "Night Train with Nora"
  de: "Nachtzug mit Nora"
  fr: "Train de nuit avec Nora"
  it: "Treno notturno con Nora"
  es: "Tren nocturno con Nora"
