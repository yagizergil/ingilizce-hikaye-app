  'favourite': 'favorite'
  'tranquillity': 'tranquility'
  'tranquillize': 'tranquilize'

# İngilizce kısaltmalar -> açık biçim. Kesme işareti kaldırılmış/kaldırılmamış
# her iki biçim de anahtar olarak tutulur (metin temizlemede apostrof
# farklı unicode karakterlerle gelebiliyor, normalize.py hem düz hem
# tipografik apostrofu aynı anahtara indirger).
contractions:
  'don''t': 'do not'
  'doesn''t': 'does not'
  'didn''t': 'did not'
  'won''t': 'will not'
  'wouldn''t': 'would not'
  'can''t': 'can not'
  'couldn''t': 'could not'
  'shouldn''t': 'should not'
  'isn''t': 'is not'
  'aren''t': 'are not'
  'wasn''t': 'was not'
  'weren''t': 'were not'
  'haven''t': 'have not'
  'hasn''t': 'has not'
  'hadn''t': 'had not'
  'ain''t': 'is not'
  'i''m': 'i am'
  'you''re': 'you are'
  'we''re': 'we are'
  'they''re': 'they are'
  'it''s': 'it is'
  'he''s': 'he is'
  'she''s': 'she is'
  'that''s': 'that is'
  'there''s': 'there is'
  'here''s': 'here is'
  'what''s': 'what is'
  'who''s': 'who is'
  'i''ve': 'i have'
  'you''ve': 'you have'
  'we''ve': 'we have'
  'they''ve': 'they have'
  'i''ll': 'i will'
  'you''ll': 'you will'
  'he''ll': 'he will'
  'she''ll': 'she will'
  'we''ll': 'we will'
  'they''ll': 'they will'
  'it''ll': 'it will'
  'i''d': 'i would'
  'you''d': 'you would'
  'he''d': 'he would'
  'she''d': 'she would'
  'we''d': 'we would'
  'they''d': 'they would'
  'let''s': 'let us'
  'y''all': 'you all'
  'o''clock': 'of the clock'

# Eye-dialect: yazarların telaffuzu taklit etmek için kullandığı, standart
# olmayan yazımlar (genelde köylü/işçi sınıfı diyaloğunda). Bunlar
# dialect_ratio ölçümüne GİRER (normalizasyon ÖNCESİ sayılır), ama
# off_list_ratio'ya girmemesi için normalizasyon SONRASI standart kelimeye
# çevrilir.
eye_dialect:
  'goin''': 'going'
  'doin''': 'doing'
  'nothin''': 'nothing'
  'somethin''': 'something'
  'anythin''': 'anything'
  'comin''': 'coming'
  'runnin''': 'running'
  'talkin''': 'talking'
  'lookin''': 'looking'
  'gettin''': 'getting'
  'wonderin''': 'wondering'
  'askin''': 'asking'
  'o''': 'of'
  '''em': 'them'
  '''tis': 'it is'
  '''twas': 'it was'
  '''twill': 'it will'
  'ast': 'asked'
  'axed': 'asked'
  'knowed': 'knew'
  'seed': 'saw'
  'hisself': 'himself'
  'theirselves': 'themselves'
  'acrost': 'across'
  'yor': 'your'
  'w''ile': 'while'
  '''cause': 'because'
  '''bout': 'about'
  '''fore': 'before'
  '''gainst': 'against'
  '''cept': 'except'
  'gonna': 'going to'
  'gotta': 'got to'
  'wanna': 'want to'
  'gimme': 'give me'
  'lemme': 'let me'
  'kinda': 'kind of'
  'sorta': 'sort of'
  'dunno': 'do not know'
  'yer': 'your'
  'aye': 'yes'
  'nay': 'no'
