  'grey': 'gray'
  'cheque': 'check'
  'jewellery': 'jewelry'
  'travelling': 'traveling'
  'travelled': 'traveled'
  'traveller': 'traveler'
  'cancelled': 'canceled'
  'cancelling': 'canceling'
  'modelling': 'modeling'
  'labelled': 'labeled'
  'jewelled': 'jeweled'
  'woollen': 'woolen'
  'fuelled': 'fueled'
  'signalled': 'signaled'
  'kerb': 'curb'
  'tyre': 'tire'
  'aeroplane': 'airplane'
  'mould': 'mold'
  'moult': 'molt'
  'smoulder': 'smolder'
  'plough': 'plow'
  'draught': 'draft'
