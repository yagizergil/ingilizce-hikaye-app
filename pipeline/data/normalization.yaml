# Kapsam ölçümü öncesi kelime normalizasyonu. Amaç: metnin gerçek anlamda
# aynı lemma'ya karşılık gelen ama yüzeysel biçimi farklı olan kelimelerini
# (BrE yazımı, kesme işaretli kısaltmalar, eye-dialect) CEFR sözlüğündeki
# standart AmE/tam biçime indirgemek. Bu katman olmadan off_list_ratio
# gerçekte olmayan bir "bilinmeyen kelime" oranı gösterir.
#
# TÜM anahtar ve değerler tek tırnaklıdır — tırnaksız yes/no/on/off/true/
# false YAML 1.1'de otomatik boolean'a çevriliyor ("Norway problem", bkz.
# `nay: no` -> Python'da False çıkması). load_normalization_maps() ayrıca
# bunu savunma katmanıyla da kontrol eder.

# Sondan eşleşen yazım kuralları (regex değil, basit suffix eşleştirme).
# Sıra önemli: en spesifik önce.
bre_to_ame_suffixes:
  - from: 'our'
    to: 'or'
    # 'your' BUG: -our eki değil, kelimenin kendisi tesadüfen "our" ile
    # bitiyor (y-our). is_known kapısı (bkz. normalize.py) bunu genel
    # olarak önlüyor, ama vocab olmadan çağrılan yerler (normalize_text'in
    # dialect_ratio ölçümü gibi) için burada da açıkça hariç tutuluyor.
    exceptions: ['hour', 'flour', 'sour', 'tour', 'contour', 'devour', 'glamour', 'your']
  - from: 'ise'
    to: 'ize'
    # rise/arise/raise/enterprise BUG: -ise eki değil, kelimenin kendisi
    # -ise ile bitiyor. Aynı gerekçe: is_known genel çözüm, bunlar
    # vocab'sız çağrılar için ek güvenlik.
    exceptions: ['advertise', 'advise', 'compromise', 'despise', 'disguise', 'exercise',
                 'franchise', 'improvise', 'revise', 'supervise', 'surprise', 'televise',
                 'promise', 'wise', 'otherwise', 'likewise', 'rise', 'arise', 'raise',
                 'enterprise']
  - from: 'isation'
    to: 'ization'
  - from: 'yse'
    to: 'yze'
  - from: 'ogue'
    to: 'og'
    exceptions: ['rogue', 'vogue']
  - from: 're'
    to: 'er'
    only: ['centre', 'theatre', 'metre', 'litre', 'fibre', 'calibre', 'sombre', 'sceptre']

# Tam kelime eşleşmeleri (tek yönlü, BrE -> AmE veya arkaik -> güncel).
