[project]
name = "ingilizce-hikaye-pipeline"
version = "0.1.0"
description = "Public domain content ingestion pipeline: extract, level, and publish English stories to Supabase."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "click>=8.1",
  "psycopg[binary]>=3.1",
  "spacy>=3.7",
  "lemminflect>=0.2.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "anthropic>=0.34",
  "lxml>=5.2",
  "httpx>=0.27",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-tqdm",
]

[project.scripts]
pipeline = "src.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...)/typer.Argument(...) fonksiyon çağrılarını default
# değer olarak kullanmak typer'ın standart deseni — B008 burada yanlış
# pozitif.
"src/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
