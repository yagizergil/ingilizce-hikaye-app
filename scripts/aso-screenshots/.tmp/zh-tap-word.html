<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>zh-tap-word</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; padding:0; direction:ltr; }
  body{
    width:1290px; height:2796px; background:#1F3A5F; color:#FAF8F4;
    -webkit-font-smoothing:antialiased; overflow:hidden; position:relative;
    font-family:'IBM Plex Mono', monospace;
  }
  
  *{box-sizing:border-box;}
  .phone-body{ margin:0; width:390px; height:844px; overflow:hidden; background:#FAF8F4; color:#1E1C19;
    -webkit-font-smoothing:antialiased; position:relative; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .display{ font-family:'Fraunces', Georgia, serif; }
  .reading{ font-family:'Literata', Georgia, serif; }
  .status{ height:14px; }
  [dir="rtl"] .phone-body{ direction:rtl; }

  .canvas{ display:flex; flex-direction:column; align-items:center; width:100%; height:100%; padding:110px 90px 0; }
  .eyebrow{ font-size:28px; letter-spacing:.14em; text-transform:uppercase; color:#A6572E; text-align:center; font-weight:600; direction:ltr; }
  .headline{ font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:76px; line-height:1.1;
    letter-spacing:-.01em; text-align:center; margin:22px 0 0; max-width:1080px; text-wrap:balance; color:#FAF8F4; direction:ltr; }
  .sub{ font-family:'Literata', Georgia, serif; font-size:34px; line-height:1.4; text-align:center;
    color:#B9C9DC; margin:24px 0 0; max-width:920px; direction:ltr; }
  .device{ margin-top:56px; position:relative; width:898px; height:1911px; border-radius:64px;
    background:#0c0c0c; box-shadow:0 60px 120px rgba(0,0,0,.35); flex-shrink:0; }
  .device .screen{ position:absolute; top:14px; left:14px;
    width:390px; height:844px; border-radius:52px; overflow:hidden;
    transform-origin:top left; transform: scale(2.23077); direction:ltr; }
  .notch{ position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:34px;
    background:#0c0c0c; border-radius:20px; z-index:5; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="eyebrow">书库</div>
    <div class="headline">点一下就懂</div>
    <div class="sub">点击不认识的词，立刻看到它的意思。</div>
    <div class="device">
      <div class="notch"></div>
      <div class="screen phone-body" dir="ltr">
        
  <div class="status"></div>
  <div style="height:2px;background:#E7E2D8;position:relative;"><i style="position:absolute;inset:0;width:31%;background:#A6572E;display:block;"></i></div>
  <div style="padding:14px 22px 18px;">
    <div class="reading" style="padding:6px 2px 0;font-size:18px;line-height:1.75;color:#241F19;">
      <p style="margin:0 0 20px;">He was respected by all who knew him, for his integrity and indefatigable attention to public business, and could not bear to live in poverty and
      <span style="background:rgba(166,87,46,.18);text-decoration:underline dotted #A6572E 1px;text-underline-offset:3px;">hope</span>
      in the same country where he had formerly been distinguished.</p>
    </div>
  </div>
  <div style="position:absolute; left:0; right:0; bottom:0; margin:0 24px 22px; padding:18px 20px; background:#fff; border-radius:20px; box-shadow:0 18px 40px rgba(30,28,25,.14);">
    <div class="mono" style="font-size:9px;color:#8A8378;text-transform:uppercase;letter-spacing:.06em;">名词</div>
    <div class="reading" style="font-style:italic;font-size:17px;margin-top:6px;">hope</div>
    <div class="mono" style="font-size:13px;color:#A6572E;margin-top:4px;">希望</div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <div class="mono" style="font-size:10px;letter-spacing:.06em;border:1px solid #1E1C19;padding:8px 12px;border-radius:8px;">发音</div>
      <div class="mono" style="font-size:10px;letter-spacing:.06em;background:#1E1C19;color:#FAF8F4;padding:8px 12px;border-radius:8px;">收藏</div>
    </div>
  </div>
      </div>
    </div>
  </div>
</body>
</html>
