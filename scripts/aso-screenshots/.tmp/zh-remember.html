<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>zh-remember</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; padding:0; direction:ltr; }
  body{
    width:1290px; height:2796px; background:#FAF8F4; color:#1E1C19;
    -webkit-font-smoothing:antialiased; overflow:hidden; position:relative;
    font-family:'IBM Plex Mono', monospace;
  }
  
  *{box-sizing:border-box;}
  .phone-body{ margin:0; width:390px; height:844px; overflow:hidden; background:#FAF8F4; color:#1E1C19;
    -webkit-font-smoothing:antialiased; position:relative; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .display{ font-family:'Fraunces', Georgia, serif; }
  .reading{ font-family:'Literata', Georgia, serif; }
  .status{ height:14px; }
  [dir="rtl"] .phone-body{ direction:rtl; }

  .canvas{ display:flex; flex-direction:column; align-items:center; width:100%; height:100%; padding:110px 90px 0; }
  .eyebrow{ font-size:28px; letter-spacing:.14em; text-transform:uppercase; color:#A6572E; text-align:center; font-weight:600; direction:ltr; }
  .headline{ font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:76px; line-height:1.1;
    letter-spacing:-.01em; text-align:center; margin:22px 0 0; max-width:1080px; text-wrap:balance; color:#1E1C19; direction:ltr; }
  .sub{ font-family:'Literata', Georgia, serif; font-size:34px; line-height:1.4; text-align:center;
    color:#8A8378; margin:24px 0 0; max-width:920px; direction:ltr; }
  .device{ margin-top:56px; position:relative; width:898px; height:1911px; border-radius:64px;
    background:#0c0c0c; box-shadow:0 60px 120px rgba(0,0,0,.35); flex-shrink:0; }
  .device .screen{ position:absolute; top:14px; left:14px;
    width:390px; height:844px; border-radius:52px; overflow:hidden;
    transform-origin:top left; transform: scale(2.23077); direction:ltr; }
  .notch{ position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:34px;
    background:#0c0c0c; border-radius:20px; z-index:5; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="eyebrow">单词</div>
    <div class="headline">记得住</div>
    <div class="sub">收藏的词会在合适的时候再次出现。</div>
    <div class="device">
      <div class="notch"></div>
      <div class="screen phone-body" dir="ltr">
        
  <div class="status"></div>
  <header style="padding:26px 20px 6px;">
    <h1 class="display" style="font-size:28px;font-weight:600;margin:0;">单词</h1>
  </header>
  <div style="display:flex;gap:18px;padding:18px 20px;border-bottom:1px solid #E7E2D8;">
    <div class="mono" style="font-size:11px;color:#1E1C19;border-bottom:2px solid #A6572E;padding-bottom:9px;margin-bottom:-10px;">全部</div>
    <div class="mono" style="font-size:11px;color:#8A8378;">待复习</div>
    <div class="mono" style="font-size:11px;color:#8A8378;">已掌握</div>
  </div>
  <div style="padding:0 20px;">
    
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:20px 0;border-bottom:1px solid #E7E2D8;align-items:baseline;">
        <div class="display" style="font-size:22px;font-weight:600;">hope</div>
        <div class="mono" style="font-size:9px;color:#A6572E;text-align:right;text-transform:uppercase;letter-spacing:.05em;">今天</div>
        <div class="reading" style="font-size:15px;color:#8A8378;font-style:italic;">希望</div>
        <div class="mono" style="font-size:9px;color:#8A8378;text-align:right;">名词</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:20px 0;border-bottom:1px solid #E7E2D8;align-items:baseline;">
        <div class="display" style="font-size:22px;font-weight:600;">indefatigable</div>
        <div class="mono" style="font-size:9px;color:#A6572E;text-align:right;text-transform:uppercase;letter-spacing:.05em;">今天</div>
        <div class="reading" style="font-size:15px;color:#8A8378;font-style:italic;">yorulmak bilmez</div>
        <div class="mono" style="font-size:9px;color:#8A8378;text-align:right;">形容词</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:20px 0;border-bottom:1px solid #E7E2D8;align-items:baseline;">
        <div class="display" style="font-size:22px;font-weight:600;">despair</div>
        <div class="mono" style="font-size:9px;color:#A6572E;text-align:right;text-transform:uppercase;letter-spacing:.05em;">明天</div>
        <div class="reading" style="font-size:15px;color:#8A8378;font-style:italic;">umutsuzluk</div>
        <div class="mono" style="font-size:9px;color:#8A8378;text-align:right;">名词</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:20px 0;border-bottom:1px solid #E7E2D8;align-items:baseline;">
        <div class="display" style="font-size:22px;font-weight:600;">wretched</div>
        <div class="mono" style="font-size:9px;color:#A6572E;text-align:right;text-transform:uppercase;letter-spacing:.05em;">3 天后</div>
        <div class="reading" style="font-size:15px;color:#8A8378;font-style:italic;">sefil</div>
        <div class="mono" style="font-size:9px;color:#8A8378;text-align:right;">形容词</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:20px 0;border-bottom:1px solid #E7E2D8;align-items:baseline;">
        <div class="display" style="font-size:22px;font-weight:600;">distinguished</div>
        <div class="mono" style="font-size:9px;color:#A6572E;text-align:right;text-transform:uppercase;letter-spacing:.05em;">1 周后</div>
        <div class="reading" style="font-size:15px;color:#8A8378;font-style:italic;">seçkin</div>
        <div class="mono" style="font-size:9px;color:#8A8378;text-align:right;">形容词</div>
      </div>
  </div>
      </div>
    </div>
  </div>
</body>
</html>
