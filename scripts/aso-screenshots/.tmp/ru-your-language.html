<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>ru-your-language</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; padding:0; direction:ltr; }
  body{
    width:1290px; height:2796px; background:#FAF8F4; color:#1E1C19;
    -webkit-font-smoothing:antialiased; overflow:hidden; position:relative;
    font-family:'IBM Plex Mono', monospace;
  }
  
  *{box-sizing:border-box;}
  .phone-body{ margin:0; width:390px; height:844px; overflow:hidden; background:#FAF8F4; color:#1E1C19;
    -webkit-font-smoothing:antialiased; position:relative; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .display{ font-family:'Fraunces', Georgia, serif; }
  .reading{ font-family:'Literata', Georgia, serif; }
  .status{ height:14px; }
  [dir="rtl"] .phone-body{ direction:rtl; }

  .canvas{ display:flex; flex-direction:column; align-items:center; width:100%; height:100%; padding:110px 90px 0; }
  .eyebrow{ font-size:28px; letter-spacing:.14em; text-transform:uppercase; color:#A6572E; text-align:center; font-weight:600; direction:ltr; }
  .headline{ font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:76px; line-height:1.1;
    letter-spacing:-.01em; text-align:center; margin:22px 0 0; max-width:1080px; text-wrap:balance; color:#1E1C19; direction:ltr; }
  .sub{ font-family:'Literata', Georgia, serif; font-size:34px; line-height:1.4; text-align:center;
    color:#8A8378; margin:24px 0 0; max-width:920px; direction:ltr; }
  .device{ margin-top:56px; position:relative; width:898px; height:1911px; border-radius:64px;
    background:#0c0c0c; box-shadow:0 60px 120px rgba(0,0,0,.35); flex-shrink:0; }
  .device .screen{ position:absolute; top:14px; left:14px;
    width:390px; height:844px; border-radius:52px; overflow:hidden;
    transform-origin:top left; transform: scale(2.23077); direction:ltr; }
  .notch{ position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:34px;
    background:#0c0c0c; border-radius:20px; z-index:5; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="eyebrow">ЯЗЫК ИНТЕРФЕЙСА</div>
    <div class="headline">На каком языке вы говорите?</div>
    <div class="sub">Приложение и переводы слов будут показаны на этом языке.</div>
    <div class="device">
      <div class="notch"></div>
      <div class="screen phone-body" dir="ltr">
        
  <div class="status"></div>
  <div style="padding:14px 20px;"><span class="mono" style="font-size:11px;color:#8A8378;">✕</span></div>
  <div style="padding:8px 24px;">
    <div class="display" style="font-size:26px;font-weight:600;">На каком языке вы говорите?</div>
  </div>
  <div style="padding:16px 20px 0;">
    
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/gb.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">English</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/es.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">Español</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/cn.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">中文</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/fr.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">Français</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/sa.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">العربية</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/ru.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">Русский</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/de.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">Deutsch</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7E2D8;">
        <img src="https://hatscripts.github.io/circle-flags/flags/jp.svg" style="width:30px;height:30px;border-radius:50%;display:block;" />
        <div class="display" style="font-size:17px;font-weight:600;">日本語</div>
      </div>
  </div>
      </div>
    </div>
  </div>
</body>
</html>
